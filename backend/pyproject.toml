[project]
name = "incident-agent"
version = "0.1.0"
description = "AI agent that investigates telecom network incidents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastembed>=0.9.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "langchain_google_genai.*", "langchain_groq.*", "langchain_ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db and not llm and not embed'"
markers = [
    "db: needs a running Postgres (docker compose up -d); runs against the incident_agent_test database",
    "llm: calls a live LLM provider (needs API keys / Ollama)",
    "embed: loads the real embedding model (downloads ~100 MB on first use)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
