services:
  db:
    image: pgvector/pgvector:pg17
    container_name: incident-agent-db
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
